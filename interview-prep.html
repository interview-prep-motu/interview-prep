<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Interview Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8fa;color:#1f2328;line-height:1.6;height:100vh;overflow:hidden;display:flex}

/* ── SIDEBAR ── */
#sidebar{width:260px;min-width:260px;height:100vh;background:#ffffff;border-right:1px solid #d0d7de;display:flex;flex-direction:column;overflow:hidden}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid #d0d7de;flex-shrink:0}
.sb-brand h1{font-size:15px;font-weight:700;color:#1f2328}
.sb-brand p{font-size:11px;color:#57606a;margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 0 20px}
.sb-section{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#57606a;padding:10px 18px;margin:0;background:#f0f4f8;border:none;border-bottom:1px solid #d0d7de;border-top:1px solid #d0d7de;border-radius:0;position:sticky;top:0;z-index:10}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;font-size:13px;color:#57606a;transition:all 0.1s;border-left:3px solid transparent;line-height:1.3}
.sb-item:hover{background:#f6f8fa;color:#1f2328}
.sb-item.active{background:#f0f6ff;color:#0969da;border-left-color:#0969da;font-weight:600}
.sb-item-letter{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.sb-item-num{font-size:10px;font-weight:700;color:#8c959f;min-width:20px}
.sb-item-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.sb-sub{padding-left:30px;font-size:12px}
.ocp-points{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.ocp-point{background:#f6f8fa;border-left:3px solid #d0d7de;padding:8px 12px;font-size:13px;color:#1f2328;border-radius:0 6px 6px 0;line-height:1.5}
.oop-body{padding:0 28px 28px}
.oop-section{margin-top:0;border-bottom:1px solid #f0f0f0}
.oop-section:last-child{border-bottom:none}
.oop-section-heading{font-size:14px;font-weight:600;color:#1f2328;padding:13px 28px;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background 0.1s}
.oop-section.collapsed .oop-section-heading,.oop-section-heading[onclick]{cursor:pointer}
.oop-section-heading[onclick]:hover{background:#f6f8fa}
.oop-section-heading[onclick]::after{content:'›';font-size:18px;color:#8c959f;transform:rotate(90deg);display:inline-block;transition:transform 0.2s;flex-shrink:0}
.oop-section.collapsed .oop-section-heading::after{transform:rotate(0deg)}
.oop-section-content{overflow:hidden;transition:max-height 0.25s ease,opacity 0.2s ease;max-height:8000px;opacity:1;padding:0 28px 18px}
.oop-section.collapsed .oop-section-content{max-height:0;opacity:0;padding-bottom:0}
.oop-section-body{font-size:14px;color:#1f2328;line-height:1.8;margin-bottom:12px}
.oop-section-body ul,.oop-section-body ol{margin:8px 0 8px 20px;padding:0}
.oop-section-body li{margin-bottom:6px}
.oop-section-body table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.oop-section-body th{background:#f6f8fa;padding:7px 12px;text-align:left;border:1px solid #d0d7de;font-weight:600}
.oop-section-body td{padding:6px 12px;border:1px solid #d0d7de}
.oop-section-body tr:nth-child(even) td{background:#fafafa}
.oop-section-body code{background:#f0f4f8;color:#0550ae;padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12px}
.oop-section-body pre{background:#f6f8fa;border:1px solid #d0d7de;border-radius:6px;padding:10px 14px;font-size:12px;font-family:Consolas,monospace;overflow-x:auto;margin:10px 0}
.oop-code{background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:16px 18px;font-size:12px;font-family:Consolas,monospace;white-space:pre;overflow-x:auto;margin-top:10px;line-height:1.6}
.sb-ptag{font-size:9px;font-weight:600;padding:1px 5px;border-radius:8px;background:#f0f6ff;color:#0550ae;border:1px solid #b6d4fe}
.sb-chip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:auto;flex-shrink:0}
.sb-easy{background:#dafbe1;color:#1a7f37}.sb-med{background:#fff8c5;color:#7d4e00}.sb-hard{background:#ffebe9;color:#cf222e}

/* ── MAIN CONTENT ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content-header{background:#fff;border-bottom:1px solid #d0d7de;padding:14px 36px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#content-title{font-size:17px;font-weight:700;color:#1f2328}
#content-badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
#content-body{flex:1;overflow-y:auto;padding:32px 40px}

.ptag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:#f0f6ff;color:#0550ae;border:1px solid #b6d4fe}

/* ── HOME SCREEN ── */
.home-screen{max-width:700px;margin:40px auto 0}
.home-screen h2{font-size:22px;font-weight:700;color:#1f2328;margin-bottom:8px}
.home-screen p{font-size:14px;color:#57606a;line-height:1.7;margin-bottom:28px}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.home-card{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:18px;cursor:pointer;transition:all 0.15s}
.home-card:hover{border-color:#0969da;box-shadow:0 4px 16px rgba(9,105,218,0.08)}
.home-card h3{font-size:14px;font-weight:700;color:#1f2328;margin-bottom:4px}
.home-card p{font-size:13px;color:#57606a}

.detail-body{padding-bottom:40px}

/* overview */
.overview-box{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:22px 26px;margin-bottom:28px}
.overview-box h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:10px}
.overview-box p{font-size:15px;color:#1f2328;line-height:1.7}

/* two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.panel{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:20px}
.panel h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:14px}
.class-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.class-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.class-name{font-size:13px;font-weight:700;color:#0550ae;min-width:160px;font-family:'Cascadia Code',Consolas,monospace}
.class-role{font-size:12.5px;color:#57606a;line-height:1.5}
.design-item{margin-bottom:10px;font-size:13.5px;color:#1f2328;line-height:1.6;padding-left:14px;position:relative}
.design-item::before{content:"→";position:absolute;left:0;color:#8c959f;font-size:11px;top:2px}

/* code section */
.code-section{margin-bottom:28px}
.code-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:10px}
.code-tabs{display:flex;gap:2px;margin-bottom:0;border-bottom:2px solid #d0d7de}
.code-tab{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;color:#57606a;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;margin-bottom:-2px}
.code-tab.active{background:#fff;color:#0969da;border-color:#d0d7de;border-bottom-color:#fff}
.code-tab:not(.active):hover{background:#f6f8fa;color:#1f2328}
.code-pane{display:none;background:#fff;border:1px solid #d0d7de;border-top:none;border-radius:0 0 8px 8px;overflow:hidden}
.code-pane.active{display:block}
.code-pane pre{padding:20px;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12.5px;line-height:1.65;overflow-x:auto;color:#1f2328;background:#f6f8fa}
.kw{color:#cf222e}.cl{color:#953800}.fn{color:#8250df}.cm{color:#6e7781;font-style:italic}.st{color:#0a3069}.an{color:#1a7f37}

/* SOLID applied */
.solid-applied{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:22px 26px;margin-bottom:28px}
.solid-applied h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:16px}
.solid-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.solid-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.solid-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.sb-s{background:#dafbe1;color:#1a7f37}.sb-o{background:#ddf4ff;color:#0550ae}.sb-l{background:#fbefff;color:#8250df}.sb-i{background:#fff8c5;color:#7d4e00}.sb-d{background:#ffebe9;color:#cf222e}
.solid-row-text{font-size:13.5px;color:#1f2328;line-height:1.6}
.solid-row-text strong{font-weight:600}

/* difficulty chips */
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.chip-easy{background:#dafbe1;color:#1a7f37;border:1px solid #4ac26b}
.chip-med{background:#fff8c5;color:#7d4e00;border:1px solid #eac54f}
.chip-hard{background:#ffebe9;color:#cf222e;border:1px solid #ff8182}

/* collapsible sidebar sections */
.sb-section{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.07)}
.sb-section:hover{background:#e8edf3;color:#1f2328}
.sb-section::after{content:'▾';font-size:10px;color:#8c959f;transition:transform 0.2s;flex-shrink:0}
.sb-section.collapsed::after{transform:rotate(-90deg)}
.sb-group{overflow:hidden;max-height:2000px;transition:max-height 0.3s ease,opacity 0.2s ease;opacity:1}
.sb-group.collapsed{max-height:0;opacity:0}

/* SOLID diagrams */
.spc-diag{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 20px;padding:16px 18px;background:#f9fafb;border-radius:8px;border:1px solid #e5e8eb}
.spc-diag-side{display:flex;flex-direction:column;gap:6px}
.spc-diag-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:2px}
.spc-dlbl-bad{color:#cf222e}
.spc-dlbl-good{color:#1a7f37}
.spc-dbox{border-radius:6px;padding:6px 10px;font-size:11px;font-family:Consolas,monospace;line-height:1.6}
.spc-dbox-red{background:#fff5f5;border:1.5px solid #ff8182;color:#cf222e}
.spc-dbox-green{background:#f0fff4;border:1.5px solid #4ac26b;color:#1a7f37}
.spc-dbox-gray{background:#f6f8fa;border:1.5px solid #d0d7de;color:#57606a}
.spc-dbox-blue{background:#f0f6ff;border:1.5px solid #b6d4fe;color:#0550ae}
.spc-darrow{text-align:center;font-size:14px;color:#8c959f;line-height:1.2}
.spc-dnote{font-size:11px;color:#57606a;margin-top:4px;line-height:1.4}
.spc-dnote-red{color:#cf222e}
.spc-dnote-green{color:#1a7f37}

/* scrollbars */
#sidebar .sb-scroll::-webkit-scrollbar,#content-body::-webkit-scrollbar{width:5px}
#sidebar .sb-scroll::-webkit-scrollbar-track,#content-body::-webkit-scrollbar-track{background:transparent}
#sidebar .sb-scroll::-webkit-scrollbar-thumb,#content-body::-webkit-scrollbar-thumb{background:#d0d7de;border-radius:3px}

/* SOLID Index page */
.solid-index-body{padding-bottom:40px}
.solid-principle-card{background:#fff;border:1px solid #d0d7de;border-radius:10px;margin-bottom:28px;overflow:hidden}
.spc-header{padding:20px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #f0f0f0}
.spc-letter{font-size:44px;font-weight:900;line-height:1}
.spc-title{font-size:18px;font-weight:700;color:#1f2328}
.spc-tagline{font-size:13px;color:#57606a;font-style:italic}
.spc-body{padding:20px 24px}
.spc-what{font-size:14px;color:#1f2328;margin-bottom:20px;line-height:1.7}
.spc-examples{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.spc-ex{border-radius:8px;overflow:hidden;border:1px solid #d0d7de}
.spc-ex-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;padding:10px 14px 6px;background:#f6f8fa;border-bottom:1px solid #d0d7de}
.spc-ex-half{padding:10px 14px}
.spc-ex-half+.spc-ex-half{border-top:1px dashed #d0d7de}
.spc-bad-label{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#ffebe9;color:#cf222e;border:1px solid #ff8182;margin-bottom:5px}
.spc-good-label{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#dafbe1;color:#1a7f37;border:1px solid #4ac26b;margin-bottom:5px}
.spc-ex-text{font-size:13px;color:#1f2328;line-height:1.55;margin-bottom:6px}
.spc-ex-code{font-family:Consolas,monospace;font-size:11px;border-radius:4px;padding:6px 8px;display:block;white-space:pre-wrap;word-break:break-word}
.spc-bad-code{background:#fff5f5;color:#cf222e;border:1px solid #ffcecb}
.spc-good-code{background:#f0fff4;color:#1a7f37;border:1px solid #b7f0c4}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sb-brand">
    <h1>Interview Guide</h1>
  </div>
  <div class="sb-scroll">
    <div class="sb-section collapsed" onclick="toggleSbSection('sb-oop')">OOP Concepts</div>
    <div id="sb-oop" class="sb-group collapsed"></div>
    <div class="sb-section collapsed" onclick="toggleSbSection('sb-concepts')">LLD Concepts</div>
    <div id="sb-concepts" class="sb-group collapsed"></div>
    <div class="sb-section collapsed" onclick="toggleSbSection('sb-problems')">LLD Problems</div>
    <div id="sb-problems" class="sb-group collapsed"></div>
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="content-header">
    <div id="content-title">Welcome</div>
    <div id="content-badges"></div>
  </div>
  <div id="content-body"></div>
</div>

<script>
// ── SOLID PRINCIPLES DATA ──
const solidData = [
  {
    letter:'S', color:'#1a7f37', cls:'sb-s',
    name:'Single Responsibility',
    tagline:'"One class, one job"',
    what:'A class should do <strong>one thing only</strong>. If you describe it with "AND" — <em>"ParkingLot allocates spots AND issues tickets AND processes payments"</em> — that\'s a sign to split. When each class owns one job, changing fee logic never accidentally breaks spot logic.',
    diagram:`
      <div class="spc-diag">
        <div class="spc-diag-side">
          <div class="spc-diag-lbl spc-dlbl-bad">❌ Bad — one class, many jobs</div>
          <div class="spc-dbox spc-dbox-red">
            <strong>ParkingLot</strong><br>
            allocateSpot()<br>
            generateTicket()<br>
            processPayment()<br>
            printReceipt()
          </div>
          <div class="spc-dnote spc-dnote-red">Change fee logic → must open this class → risk breaking spot logic</div>
        </div>
        <div class="spc-diag-side">
          <div class="spc-diag-lbl spc-dlbl-good">✓ Good — each class, one job</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <div class="spc-dbox spc-dbox-green"><strong>SpotAllocator</strong>  — allocate only</div>
            <div class="spc-dbox spc-dbox-green"><strong>TicketManager</strong>  — tickets only</div>
            <div class="spc-dbox spc-dbox-green"><strong>PaymentService</strong> — fees only</div>
            <div class="spc-dbox spc-dbox-green"><strong>ReceiptPrinter</strong> — receipts only</div>
          </div>
          <div class="spc-dnote spc-dnote-green">Change fee logic → only touch PaymentService — nothing else affected</div>
        </div>
      </div>`,
    examples:[
      {
        tag:'Parking Lot',
        badText:'ParkingLot does 4 things at once. Fixing a bug in payment could accidentally break spot allocation.',
        badCode:'class ParkingLot {\n  void allocateSpot(Vehicle v) { ... }   // job 1\n  Ticket issueTicket(Vehicle v) { ... }  // job 2\n  void pay(Ticket t) { ... }             // job 3\n  void printReceipt(Ticket t) { ... }    // job 4\n}',
        goodText:'Four classes, each with one job. Touch PaymentService — SpotAllocator is never affected.',
        goodCode:'class SpotAllocator  { ParkingSpot allocate(Vehicle v) { ... } }\nclass TicketManager  { Ticket issue(Vehicle v) { ... } }\nclass PaymentService { void pay(Ticket t) { ... } }\nclass ReceiptPrinter { void print(Ticket t) { ... } }'
      },
      {
        tag:'Uber',
        badText:'Trip class does GPS, fare, notifications, AND database. Four unrelated reasons to change one class.',
        badCode:'class Trip {\n  double calculateFare() { ... }  // job 1\n  Location trackGPS() { ... }     // job 2\n  void notifyDriver() { ... }     // job 3\n  void saveToDB() { ... }         // job 4\n}',
        goodText:'Each job extracted. Changing GPS provider only touches LocationTracker — Trip is never opened.',
        goodCode:'class FareCalculator  { double calculate(Trip t) { ... } }\nclass LocationTracker { Location getCurrent(Driver d) { ... } }\nclass NotificationSvc { void notify(Driver d) { ... } }\nclass TripRepository  { void save(Trip t) { ... } }'
      },
      {
        tag:'Vending Machine',
        badText:'VendingMachine manages inventory, takes money, dispenses items AND logs — all in one class.',
        badCode:'class VendingMachine {\n  void manageInventory() { ... }      // job 1\n  void acceptPayment(int amt) { ... } // job 2\n  void dispenseItem(String c) { ... } // job 3\n  void logTransaction(String t) { ... }// job 4\n}',
        goodText:'Each concern isolated. Adding cloud logging only touches TransactionLogger — nothing else changes.',
        goodCode:'class InventoryManager  { boolean isAvailable(String c) { ... } }\nclass PaymentProcessor  { boolean accept(int amount) { ... } }\nclass Dispenser         { void dispense(String code) { ... } }\nclass TransactionLogger { void log(String tx) { ... } }'
      },
    ]
  },
  {
    letter:'O', color:'#0550ae', cls:'sb-o',
    name:'Open / Closed',
    tagline:'"Add new behaviour — never edit old code"',
    what:'Existing, working code should <strong>never need to be opened</strong> just to add a new feature. The fix: define an interface. Each new variant is a new class that implements it. Your if/else chain stops growing forever.',
    diagram:`
      <div class="spc-diag">
        <div class="spc-diag-side">
          <div class="spc-diag-lbl spc-dlbl-bad">❌ Bad — keep editing the same method</div>
          <div class="spc-dbox spc-dbox-red">
            <strong>getFee(type)</strong><br>
            if type == "hourly" → ...<br>
            if type == "daily"  → ...<br>
            <em>// add EV? edit this file ❌</em>
          </div>
          <div class="spc-dnote spc-dnote-red">Every new vehicle type = risky edit to working code</div>
        </div>
        <div class="spc-diag-side">
          <div class="spc-diag-lbl spc-dlbl-good">✓ Good — add a new class each time</div>
          <div class="spc-dbox spc-dbox-blue" style="margin-bottom:6px"><strong>&lt;&lt;interface&gt;&gt; PricingStrategy</strong><br>calculate(ticket)</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <div class="spc-dbox spc-dbox-green">HourlyPricing</div>
            <div class="spc-dbox spc-dbox-green">DailyPricing</div>
            <div class="spc-dbox spc-dbox-green" style="border-style:dashed">EVPricing ✦ new</div>
          </div>
          <div class="spc-dnote spc-dnote-green">Add EV pricing = new class only. Old classes untouched.</div>
        </div>
      </div>`,
    examples:[
      {
        tag:'Parking Lot',
        badText:'Adding EV pricing means editing this method — you could accidentally break hourly or daily logic.',
        badCode:'double getFee(Ticket t, String type) {\n  if (type.equals("hourly")) return t.hours * 20;\n  if (type.equals("daily"))  return 200;\n  // add EV? you must edit here ❌\n}',
        goodText:'EVPricing is a brand-new class. HourlyPricing and DailyPricing are never touched.',
        goodCode:'interface PricingStrategy { double calculate(Ticket t); }\n\nclass HourlyPricing implements PricingStrategy {\n  public double calculate(Ticket t) { return t.hours * 20; }\n}\nclass DailyPricing  implements PricingStrategy {\n  public double calculate(Ticket t) { return 200; }\n}\nclass EVPricing     implements PricingStrategy {\n  public double calculate(Ticket t) { return t.hours * 30; } // new ✓\n}'
      },
      {
        tag:'BookMyShow',
        badText:'Adding BNPL means editing PaymentService\'s if/else — every change risks breaking Card and UPI.',
        badCode:'void pay(Order o, String method) {\n  if (method.equals("card")) { ... }\n  if (method.equals("upi"))  { ... }\n  // add BNPL? edit here ❌\n}',
        goodText:'BNPLPayment is a new class. PaymentService takes a PaymentMethod interface — never needs editing.',
        goodCode:'interface PaymentMethod { boolean pay(Order o); }\n\nclass CardPayment implements PaymentMethod { ... }\nclass UPIPayment  implements PaymentMethod { ... }\nclass BNPLPayment implements PaymentMethod { ... } // new ✓'
      },
      {
        tag:'Splitwise',
        badText:'Adding "split by income" means cracking open the Splitter method and adding another branch.',
        badCode:'Map split(Expense e, String type) {\n  if (type.equals("equal"))   { ... }\n  if (type.equals("percent")) { ... }\n  // add income split? edit here ❌\n}',
        goodText:'IncomeSplit is a new class. EqualSplit and PercentageSplit are never modified.',
        goodCode:'interface SplitStrategy { Map<User,Double> split(Expense e); }\n\nclass EqualSplit      implements SplitStrategy { ... }\nclass PercentageSplit implements SplitStrategy { ... }\nclass IncomeSplit     implements SplitStrategy { ... } // new ✓'
      },
    ]
  },
  {

`public class SeatLockService {
    // Map<seatId, lock expiry time>
    private final Map<String, Long> locks = new ConcurrentHashMap<>();
    private static final long LOCK_TTL_MS = 5 * 60 * 1000; // 5 minutes

    public boolean lock(Seat seat, String userId) {
        String key = seat.getId();
        if (locks.containsKey(key) && locks.get(key) > System.currentTimeMillis()) {
            return false; // already locked
        }
        locks.put(key, System.currentTimeMillis() + LOCK_TTL_MS);
        return true;
    }

    public void release(Seat seat) {
        locks.remove(seat.getId());
    }

    public boolean isLocked(Seat seat) {
        Long expiry = locks.get(seat.getId());
        return expiry != null && expiry > System.currentTimeMillis();
    }
}`

      {label:'Debt Simplifier', code:
`public class DebtSimplifier {
    // Greedy: reduce N*(N-1)/2 transactions to at most N-1
    public List<Transaction> simplify(Map<User, Double> netBalances) {
        List<Transaction> result = new ArrayList<>();
        PriorityQueue<Map.Entry<User,Double>> credits =
            new PriorityQueue<>((a,b) -> Double.compare(b.getValue(), a.getValue()));
        PriorityQueue<Map.Entry<User,Double>> debits =
            new PriorityQueue<>((a,b) -> Double.compare(a.getValue(), b.getValue()));

        netBalances.entrySet().forEach(e -> {
            if (e.getValue() > 0) credits.add(e);
            else if (e.getValue() < 0) debits.add(e);
        });

        while (!credits.isEmpty() && !debits.isEmpty()) {
            var creditor = credits.poll();
            var debtor   = debits.poll();
            double amount = Math.min(creditor.getValue(), -debtor.getValue());
            result.add(new Transaction(debtor.getKey(), creditor.getKey(), amount));
            // requeue remainder if any
        }
        return result;
    }
}`

`public class BalanceCalculator {

    public Map<User, Double> calculate(Group group) {

        group.getMembers().forEach(u -> balances.put(u, 0.0));

        for (Expense expense : group.getExpenses()) {
            User payer = expense.getPayer();

`public class CashDispenser {
    // SRP — only dispenses cash
    private final Map<Integer, Integer> cassettes; // denomination → count

    public CashDispenser(Map<Integer, Integer> cassettes) {
        this.cassettes = new TreeMap<>(Collections.reverseOrder());
        this.cassettes.putAll(cassettes);
    }

    public Map<Integer, Integer> dispense(double amount) {
        Map<Integer, Integer> dispensed = new LinkedHashMap<>();
        int remaining = (int) amount;
        for (Map.Entry<Integer, Integer> entry : cassettes.entrySet()) {
            int denom = entry.getKey();
            int count = Math.min(remaining / denom, entry.getValue());
            if (count > 0) {
                dispensed.put(denom, count);
                remaining -= denom * count;
                cassettes.put(denom, entry.getValue() - count);
            }
        }
        if (remaining > 0) throw new InsufficientCashException();
        return dispensed;
    }
}`

`public abstract class Piece {
    protected PieceColor color;
    protected Cell position;

    public abstract List<Cell> getValidMoves(Board board);
    public PieceColor getColor() { return color; }
    public boolean isEnemy(Piece other) { return !this.color.equals(other.color); }
}

public class Rook extends Piece {
    public List<Cell> getValidMoves(Board board) {
        List<Cell> moves = new ArrayList<>();
        // horizontal + vertical rays until blocked
        int[][] directions = {{0,1},{0,-1},{1,0},{-1,0}};
        for (int[] dir : directions) {
            int r = position.getRow() + dir[0];
            int c = position.getCol() + dir[1];
            while (board.isValid(r, c)) {
                Cell cell = board.getCell(r, c);
                if (cell.isEmpty()) moves.add(cell);
                else { if (cell.getPiece().isEnemy(this)) moves.add(cell); break; }
                r += dir[0]; c += dir[1];
            }
        }
        return moves;
    }
}`

        if (!piece.getValidMoves(board).contains(to))

        switchTurn();

`public interface EncodingStrategy {
    String encode(String url);
}

public class Base62Encoding implements EncodingStrategy {
    private static final String CHARS =
        "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    private static final int BASE = 62;
    private final AtomicLong counter = new AtomicLong(100_000_000L);

    public String encode(String url) {
        long id = counter.getAndIncrement();
        StringBuilder sb = new StringBuilder();
        while (id > 0) {
            sb.append(CHARS.charAt((int)(id % BASE)));
            id /= BASE;
        }
        return sb.reverse().toString();
    }
}

public class URLShortener {
    private final EncodingStrategy encoder; // DIP
    private final URLRepository repo;       // DIP

    public URLShortener(EncodingStrategy encoder, URLRepository repo) {
        this.encoder = encoder;
        this.repo    = repo;
    }

    public String shorten(String originalUrl) {
        String code = encoder.encode(originalUrl);
        while (repo.exists(code)) code = encoder.encode(originalUrl); // collision retry
        repo.save(new URLMapping(code, originalUrl));
        return "https://short.ly/" + code;
    }
}`

`public interface RateLimiter {
    RateLimitResult tryAcquire(String clientId, String endpoint);
}

public class TokenBucketLimiter implements RateLimiter {
    private final int capacity;       // max tokens
    private final double refillRate;  // tokens per second
    private final BucketStore store;  // DIP — Redis or in-memory

    public TokenBucketLimiter(int capacity, double refillRate, BucketStore store) {
        this.capacity   = capacity;
        this.refillRate = refillRate;
        this.store      = store;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        String key = clientId + ":" + endpoint;
        Bucket bucket = store.getOrCreate(key, capacity);
        bucket.refill(refillRate);

        if (bucket.getTokens() >= 1) {
            bucket.consume(1);
            store.save(key, bucket);
            return RateLimitResult.allowed(bucket.getTokens());
        }
        return RateLimitResult.denied(bucket.getRetryAfterSeconds());
    }
}`
      },
      {label:'Sliding Window', code:
`public class SlidingWindowLimiter implements RateLimiter {
    private final int maxRequests;
    private final long windowMs;
    private final BucketStore store;

    public SlidingWindowLimiter(int maxRequests, long windowMs, BucketStore store) {
        this.maxRequests = maxRequests;
        this.windowMs    = windowMs;
        this.store       = store;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        String key = clientId + ":" + endpoint;
        long now = System.currentTimeMillis();
        long windowStart = now - windowMs;

        List<Long> timestamps = store.getTimestamps(key);
        // evict old timestamps outside the window
        timestamps.removeIf(t -> t < windowStart);

        if (timestamps.size() < maxRequests) {
            timestamps.add(now);
            store.saveTimestamps(key, timestamps);
            return RateLimitResult.allowed(maxRequests - timestamps.size());
        }
        long retryAfter = (timestamps.get(0) + windowMs - now) / 1000;
        return RateLimitResult.denied(retryAfter);
    }
}`
      },
      {label:'Limiter Chain', code:
`public class RateLimiterChain implements RateLimiter {
    // Chain of Responsibility — apply limiters in order
    private final List<RateLimiter> limiters;

    public RateLimiterChain(List<RateLimiter> limiters) {
        this.limiters = limiters;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        for (RateLimiter limiter : limiters) {
            RateLimitResult result = limiter.tryAcquire(clientId, endpoint);
            if (!result.isAllowed()) return result; // fail fast
        }
        return RateLimitResult.allowed(-1); // all passed
    }
}

// Usage: global limit → per-user limit → per-endpoint limit
RateLimiter chain = new RateLimiterChain(List.of(
    new TokenBucketLimiter(1000, 100, store), // global: 1000 req/s
    new SlidingWindowLimiter(100, 60_000, store) // per-user: 100/min
));`

      {label:'Scheduling Strategy', code:
`public interface SchedulingStrategy {
    Elevator selectElevator(List<Elevator> elevators, FloorRequest request);
}

public class LOOKStrategy implements SchedulingStrategy {
    public Elevator selectElevator(List<Elevator> elevators, FloorRequest request) {
        return elevators.stream()
            .filter(e -> e.getState() != ElevatorStatus.MAINTENANCE)
            .min(Comparator.comparingInt(e -> cost(e, request)))
            .orElseThrow();
    }

    private int cost(Elevator e, FloorRequest req) {
        int dist = Math.abs(e.getFloor() - req.getFloor());
        boolean sameDir = (e.getDirection() == Direction.UP && req.getFloor() > e.getFloor())
                       || (e.getDirection() == Direction.DOWN && req.getFloor() < e.getFloor());
        return sameDir ? dist : dist + 100; // penalise direction change
    }
}

    private final List<Elevator> elevators;
    private final SchedulingStrategy scheduler; // DIP + OCP

        this.elevators = elevators;
        this.scheduler = scheduler;
    }

    public void handleRequest(FloorRequest request) {
        Elevator chosen = scheduler.selectElevator(elevators, request);
        chosen.addRequest(request);
    }

    private final ChannelFactory factory;   // DIP
    private final IDeliveryRepo deliveryRepo;

    public NotificationService(ChannelFactory factory,

        this.retryHandler = retry;

    public void send(NotificationRequest request) {
        List<NotificationChannel> channels =
            factory.getChannels(request.getRecipient(), request.getType());

        for (NotificationChannel channel : channels) {
            DeliveryStatus status = new DeliveryStatus(request, channel.getType());
            boolean success = channel.send(request);
            status.setDelivered(success);
            deliveryRepo.save(status);

            if (!success && request.getPriority() == Priority.HIGH) {
                retryHandler.schedule(request, channel); // exponential backoff
            }
        }
    }

`public interface OrderAssignmentStrategy {
    DeliveryPartner assign(Order order, List<DeliveryPartner> available);

public class NearestPartnerStrategy implements OrderAssignmentStrategy {
    public DeliveryPartner assign(Order order, List<DeliveryPartner> available) {
        return available.stream()
            .filter(DeliveryPartner::isAvailable)
            .min(Comparator.comparingDouble(p ->
                distance(p.getLocation(), order.getRestaurant().getLocation())))
            .orElseThrow(() -> new NoPartnerAvailableException());

    private double distance(Location a, Location b) {

        return Math.sqrt(Math.pow(a.getLat()-b.getLat(),2) + Math.pow(a.getLng()-b.getLng(),2));
    }
}

`public class LRUCache<K, V> implements Cache<K, V> {
    private final int capacity;
    private final Map<K, Node<K,V>> map = new HashMap<>();
    private final DoublyLinkedList<K,V> list = new DoublyLinkedList<>();

    public LRUCache(int capacity) { this.capacity = capacity; }

    public Optional<V> get(K key) {
        if (!map.containsKey(key)) return Optional.empty();
        Node<K,V> node = map.get(key);
        list.moveToHead(node);
        return Optional.of(node.value);
    }

    public void put(K key, V value) {
        if (map.containsKey(key)) {
            Node<K,V> node = map.get(key);
            node.value = value;
            list.moveToHead(node);
            return;
        }
        if (map.size() >= capacity) {
            Node<K,V> tail = list.removeTail();
            map.remove(tail.key);
        }
        Node<K,V> newNode = new Node<>(key, value);
        list.addToHead(newNode);
        map.put(key, newNode);
    }

    public int size() { return map.size(); }
}

class Node<K, V> {
    K key; V value;
    Node<K,V> prev, next;
    Node(K k, V v) { key = k; value = v; }
}`
      },
      {label:'Eviction Policy', code:
`public interface EvictionPolicy<K> {
    void recordAccess(K key);
    K evict();
}

public class LRUPolicy<K> implements EvictionPolicy<K> {
    private final LinkedHashSet<K> order = new LinkedHashSet<>();

    public void recordAccess(K key) {
        order.remove(key);
        order.add(key); // add to end = most recent
    }

    public K evict() {
        K oldest = order.iterator().next(); // first = least recent
        order.remove(oldest);
        return oldest;
    }
}

public class GenericCache<K, V> {
    private final int capacity;
    private final Map<K, V> store = new HashMap<>();
    private final EvictionPolicy<K> policy; // DIP — swap LRU/LFU/FIFO

    public GenericCache(int capacity, EvictionPolicy<K> policy) {
        this.capacity = capacity;
        this.policy   = policy;
    }

    public Optional<V> get(K key) {
        if (!store.containsKey(key)) return Optional.empty();
        policy.recordAccess(key);
        return Optional.of(store.get(key));
    }

    public void put(K key, V value) {
        if (store.size() >= capacity && !store.containsKey(key))
            store.remove(policy.evict());
        store.put(key, value);
        policy.recordAccess(key);
    }
}`

`public class Board {
    private final Cell[][] grid;
    private final int size;

    public Board(int size) {
        this.size = size;
        grid = new Cell[size][size];
        for (int r = 0; r < size; r++)
            for (int c = 0; c < size; c++)
                grid[r][c] = new Cell(r, c);
    }

    public boolean place(int r, int c, Mark mark) {
        if (!grid[r][c].isEmpty()) return false;
        grid[r][c].setMark(mark);
        return true;
    }

    public boolean isFull() {
        for (Cell[] row : grid)
            for (Cell cell : row)
                if (cell.isEmpty()) return false;
        return true;
    }

    public Cell[][] getGrid() { return grid; }
}

public class Game {
    private final Board board;
    private final Player[] players;
    private int current = 0;
    private final WinStrategy winStrategy; // DIP

    public Game(Board board, Player[] players, WinStrategy winStrategy) {
        this.board = board; this.players = players; this.winStrategy = winStrategy;
    }

    public GameResult play() {
        while (true) {
            Player p = players[current % 2];
            p.makeMove(board);
            if (winStrategy.hasWon(board, p.getMark())) return GameResult.WIN;
            if (board.isFull()) return GameResult.DRAW;
            current++;
        }
    }

public interface WinStrategy {

public class StandardWinStrategy implements WinStrategy {
    public boolean hasWon(Board board, Mark mark) {
        Cell[][] g = board.getGrid();
        int n = g.length;
        // check rows and columns
        for (int i = 0; i < n; i++) {
            if (allMatch(g[i], mark)) return true;
            boolean col = true;
            for (int j = 0; j < n; j++) col &= g[j][i].getMark() == mark;
            if (col) return true;
        }
        // check diagonals
        boolean d1 = true, d2 = true;
        for (int i = 0; i < n; i++) {
            d1 &= g[i][i].getMark() == mark;
            d2 &= g[i][n-1-i].getMark() == mark;
        }
        return d1 || d2;
    }
}`

`public class Message {
    private final long offset;
    private final String key;
    private final byte[] value;
    private final long timestamp;
}

public class Partition {
    private final int id;
    private final List<Message> log = new ArrayList<>();
    private final AtomicLong nextOffset = new AtomicLong(0);

    public synchronized long append(String key, byte[] value) {
        long offset = nextOffset.getAndIncrement();
        log.add(new Message(offset, key, value, System.currentTimeMillis()));
        return offset;
    }

    public List<Message> read(long fromOffset, int maxCount) {
        return log.stream()
            .filter(m -> m.getOffset() >= fromOffset)
            .limit(maxCount)
            .collect(Collectors.toList());
    }
}

public class Topic {
    private final String name;
    private final List<Partition> partitions;

    public Topic(String name, int numPartitions) {
        this.name = name;
        partitions = IntStream.range(0, numPartitions)
            .mapToObj(Partition::new).collect(Collectors.toList());
    }

    public Partition getPartition(int id) { return partitions.get(id); }
    public int partitionCount()           { return partitions.size(); }
}`

`public interface PartitionStrategy {
    int selectPartition(String key, int numPartitions);
}

public class KeyHashStrategy implements PartitionStrategy {
    public int selectPartition(String key, int n) {
        return key == null ? 0 : Math.abs(key.hashCode() % n);
    }
}

public class Producer {
    private final Broker broker;
    private final PartitionStrategy strategy; // DIP

    public Producer(Broker broker, PartitionStrategy strategy) {
        this.broker = broker; this.strategy = strategy;
    }

    public void publish(String topicName, String key, byte[] value) {
        Topic topic = broker.getTopic(topicName);
        int partId  = strategy.selectPartition(key, topic.partitionCount());
        topic.getPartition(partId).append(key, value);
    }
}

public class Consumer {
    private final String groupId;
    private final Map<Integer, Long> offsets = new HashMap<>(); // partitionId -> offset

    public List<Message> poll(Partition partition, int maxMessages) {
        long from = offsets.getOrDefault(partition.getId(), 0L);
        List<Message> msgs = partition.read(from, maxMessages);
        return msgs;
    }

    public void commit(int partitionId, long offset) {
        offsets.put(partitionId, offset + 1); // next to read
    }
}`

`public class StockEntry {
    private final Product product;
    private int quantity;         // physical stock
    private int reserved;         // committed to open orders
    private final int reorderThreshold;

    public int available() { return quantity - reserved; }

    public synchronized void reserve(int qty) {
        if (available() < qty)
            throw new InsufficientStockException(product.getSku(), qty, available());
        reserved += qty;
    }

    public synchronized void release(int qty) { reserved = Math.max(0, reserved - qty); }

    public synchronized void ship(int qty) {
        reserved -= qty;
        quantity  -= qty;
    }

    public boolean isBelowThreshold() { return available() < reorderThreshold; }
}

    private final Map<String, StockEntry> stock = new HashMap<>(); // sku -> entry

        if (entry == null) throw new ProductNotFoundException(sku);
        entry.reserve(qty);

      body: `<p>Every field and method you write normally <strong>belongs to an instance</strong>. When you create two <code>ParkingSpot</code> objects, each gets its own copy of every instance field — its own <code>spotId</code>, its own <code>isOccupied</code> flag, and so on. The <code>static</code> keyword fundamentally changes this: a <code>static</code> member <strong>belongs to the class itself</strong>, not to any object.</p>
<ul>
  <li>There is exactly <strong>one copy</strong> of a static field in the JVM, regardless of how many instances have been created.</li>
  <li>A static method can be called <strong>without creating an object at all</strong> — just reference the class name.</li>
  <li>Static members are loaded into memory when the class is first referenced by the JVM, <strong>before any constructor runs</strong>.</li>
  <li>All instances <strong>share</strong> the same static variable — if one instance changes it, every instance sees the new value immediately.</li>
</ul>
<p>A useful mental model: think of static state as a <strong>whiteboard on the classroom wall</strong>. Every student (instance) can see it and write on it, but there is only one whiteboard. Instance fields are like notes each student keeps in their own private notebook — separate and independent.</p>`

  <li>The expression <code>spotCounter++</code> is <em>not</em> atomic. It compiles to three JVM instructions: read the value, increment it, write it back.</li>
  <li>If two threads execute <code>spotCounter++</code> simultaneously, both may read the same value, both increment it, and both write back — you lose one increment silently.</li>
  <li>This is a <strong>data race</strong>: the result depends on unpredictable thread scheduling. It works correctly in single-threaded tests and fails intermittently in production under load.</li>
</ul>
<p><strong>The testability problem:</strong></p>
<ul>
  <li>Static state <strong>persists across tests</strong>. If test A creates three spots and test B asserts that the counter starts at zero, test B will fail or pass depending on execution order.</li>
</ul>
<p><strong>Solutions:</strong></p>
<ul>
  <li>Use <code>java.util.concurrent.atomic.AtomicInteger</code> for a thread-safe counter.</li>
  <li>Move mutable counters to <strong>instance fields</strong> on a higher-level manager class (<code>ParkingLot</code>) so each lot tracks its own spots independently — easier to test and reason about.</li>
  <li>Reserve <code>static</code> for genuinely shared, ideally immutable, data.</li>
</ul>`,

// WRONG: non-atomic static counter — broken under concurrency

    private static int spotCounter = 0; // race condition!

    public UnsafeParkingSpot() {
        spotCounter++; // READ + INCREMENT + WRITE: three separate JVM operations
                       // two threads can both read 5, both write 6 → lost increment
    }
}

// RIGHT: atomic static counter
public class SafeParkingSpot {
    private static final AtomicInteger spotCounter = new AtomicInteger(0);

    private final int spotId;

    public SafeParkingSpot() {
        this.spotId = spotCounter.incrementAndGet(); // single indivisible operation
    }

    public static int getSpotCounter() { return spotCounter.get(); }
}

    // Each floor tracks its own spots — no shared mutable static state
    // Test one floor without affecting another; reset by creating a new floor
    private int spotCount = 0;

    public ParkingSpot addSpot() {
        spotCount++;
        return new ParkingSpot(spotCount);
    }

    public int getSpotCount() { return spotCount; }

import java.util.HashMap;
import java.util.Map;
import java.util.concurrent.atomic.AtomicInteger;

public class ParkingLot {

    // 1. Static constants ────────────────────────────────────────────────
    public  static final int    MAX_CAPACITY = 500;
    public  static final int    MIN_CAPACITY = 10;
    private static final String DEFAULT_ZONE = "STANDARD";

    // 2. Thread-safe static counter ──────────────────────────────────────
    private static final AtomicInteger lotIdSequence = new AtomicInteger(0);

    // 3. Static lookup table — built in a static block ───────────────────
    private static final Map<String, Double> ZONE_RATES;

    static {
        Map<String, Double> rates = new HashMap<>();
        rates.put("PREMIUM",  5.00);
        rates.put("STANDARD", 3.00);
        rates.put("ECONOMY",  1.50);
        ZONE_RATES = Collections.unmodifiableMap(rates);
    }

    // Instance fields ────────────────────────────────────────────────────
    private final int    lotId;
    private final String name;
    private final int    capacity;
    private       int    availableSpots;

    // 4. Private constructor — enforces factory-method creation ──────────
    private ParkingLot(String name, int capacity) {
        this.lotId          = lotIdSequence.incrementAndGet();
        this.name           = name;
        this.capacity       = capacity;
        this.availableSpots = capacity;
    }

    // 5. Static factory method ───────────────────────────────────────────
    public static ParkingLot create(String name, int capacity) {
        if (name == null || name.isBlank()) {
            throw new IllegalArgumentException("Lot name required");
        }
        if (capacity < MIN_CAPACITY || capacity > MAX_CAPACITY) {
            throw new IllegalArgumentException(
                "Capacity must be " + MIN_CAPACITY + " to " + MAX_CAPACITY);
        }
        return new ParkingLot(name, capacity);
    }

    // 6. Static utility methods ──────────────────────────────────────────
    public static double getRateForZone(String zone) {
        return ZONE_RATES.getOrDefault(
            zone.toUpperCase(), ZONE_RATES.get(DEFAULT_ZONE));
    }

    public static int getTotalLotsCreated() {
        return lotIdSequence.get();
    }

    // 7. Instance methods ────────────────────────────────────────────────
    public synchronized boolean parkVehicle() {
        if (availableSpots == 0) return false;
        availableSpots--;
        return true;
    }

    public synchronized void releaseSpot() {
        if (availableSpots < capacity) availableSpots++;
    }

    public int    getLotId()          { return lotId; }
    public String getName()           { return name; }
    public int    getAvailableSpots() { return availableSpots; }
    public int    getCapacity()       { return capacity; }

    @Override
    public String toString() {
        return "ParkingLot[id=" + lotId + ", name=" + name
             + ", available=" + availableSpots + "/" + capacity + "]";
    }
}

// ParkingLot[id=1, name=Downtown Garage, available=299/300]`

      body: `<p>Java has four access levels, controlling which parts of your program can reference a given class member (field, method, constructor, or nested class). From most restrictive to least restrictive:</p>
<table>
  <thead>
    <tr>
      <th>Modifier</th>
      <th>Same class</th>
      <th>Same package</th>
      <th>Subclass (any package)</th>

  <tbody>
    <tr>

      <td>✓</td><td>✗</td><td>✗</td><td>✗</td>
    </tr>

      <td>✓</td><td>✓</td><td>✗</td><td>✗</td>
    </tr>
    <tr>
      <td><code>protected</code></td>
      <td>✓</td><td>✓</td><td>✓</td><td>✗</td>

    <tr>

    </tr>

  <li>Access modifiers apply to <strong>members</strong>. For top-level classes, only <code>public</code> and package-private are valid options.</li>

<p><strong>The golden rule of Java: make every field <code>private</code> by default.</strong> This is the core of encapsulation: the internal representation of an object can change freely without breaking any external code, because nothing external can directly touch the fields.</p>
<p><strong>What you gain with private fields:</strong></p>
<ul>
  <li><strong>Invariant protection</strong> — every write goes through a method that can validate the input before assigning</li>
  <li><strong>Freedom to refactor</strong> — change the internal type or structure without updating any callers</li>
  <li><strong>Debugging ease</strong> — only the declaring class can corrupt the field, narrowing the search space when a bug occurs</li>
  <li><strong>Read safety</strong> — you control whether to return a defensive copy or an immutable view of mutable state</li>
</ul>
<p><code>private</code> methods are equally valuable: they are implementation details that should not be part of the class contract and may be removed or renamed freely.</p>`,

<p><strong>Getters</strong> (accessors) return the value of a field:</p>
<pre>public FieldType getFieldName() { return fieldName; }</pre>
<p><strong>Setters</strong> (mutators) assign a new value — and, critically, can <strong>validate before assigning</strong>:</p>
<pre>public void setFieldName(FieldType value) {
    // validate value here, then:
    this.fieldName = value;
}</pre>
<p><strong>Key design decisions:</strong></p>
<ul>
  <li><strong>Not all fields need setters.</strong> If a field should not change after construction, declare it <code>final</code> and provide only a getter — or no getter if it is purely internal.</li>
  <li><strong>Returning mutable objects from getters leaks encapsulation.</strong> If you have a private <code>List</code> and return it directly from a getter, callers can mutate it. Return a copy or an unmodifiable view.</li>
  <li><strong>Setters must enforce invariants.</strong> A setter that blindly assigns any value is just a public field in disguise. Always validate.</li>
  <li>If every field has a trivial getter and setter with no logic, you have effectively made all fields public. Ask whether you actually need setters, or whether the class should be immutable.</li>
</ul>`,

    private       double  hourlyRate;

    // Not public because external callers should go through ParkingFloor.addSpot(),

    static ParkingSpot createForFloor(int spotId, String zone, double rate) {
        return new ParkingSpot(spotId, zone, rate);
    }

    // private constructor — creation is controlled via the package-private factory above
    private ParkingSpot(int spotId, String zone, double hourlyRate) {
        if (spotId < 1 || spotId > MAX_SPOT_ID) {
            throw new IllegalArgumentException("Invalid spot id: " + spotId);

        this.zone       = zone.toUpperCase();
        this.hourlyRate = hourlyRate;
        this.isOccupied = false;

    protected double computeFee(long durationMs) {
        double hours = durationMs / 3_600_000.0;
        return hours * hourlyRate;
    }

    private boolean isReadyForOccupancy() {
        return !isOccupied && hourlyRate > 0;
    }

    // public — the operations the wider world needs to perform on a spot
    public boolean occupy() {
        if (!isReadyForOccupancy()) return false;
        isOccupied      = true;
        occupiedSinceMs = System.currentTimeMillis();
        return true;

        if (!isOccupied) return 0.0;
        long durationMs = System.currentTimeMillis() - occupiedSinceMs;
        double fee      = computeFee(durationMs); // protected — can be overridden
        isOccupied      = false;
        return fee;
    }

    public int     getSpotId()     { return spotId; }
    public String  getZone()       { return zone; }
    public boolean isOccupied()    { return isOccupied; }
    public double  getHourlyRate() { return hourlyRate; }

    // package-private — ParkingFloor needs to reset spots for maintenance windows
    // Not public because arbitrary external callers must not reset live spots
    void reset() {
        isOccupied      = false;
        occupiedSinceMs = 0;
    }

<ul>

    public boolean isOccupied; // anyone can set this without calling occupy()
    public double  hourlyRate; // anyone can assign -500.0 — no validation possible
    public String  zone;       // anyone can set null — NullPointerException waiting to happen

    public BadParkingSpot(int spotId, String zone, double hourlyRate) {
        this.spotId     = spotId;
        this.zone       = zone;
        this.hourlyRate = hourlyRate;
    }

    public void occupy()  { isOccupied = true; }
    public void vacate()  { isOccupied = false; }
}

bad.hourlyRate = -50.0; // negative rate — fee calculation now returns garbage
bad.zone       = null;  // NPE waiting to happen in any zone-based operation

// GOOD — minimum necessary visibility, invariants enforced
public class GoodParkingSpot {
    private final int    spotId;   // final + private: set once, never touched again
    private final String zone;     // final + private: physical zone cannot change

    private double       hourlyRate;

        isOccupied      = true;
        occupiedSinceMs = System.currentTimeMillis();

        isOccupied   = false;

    public String  getZone()       { return zone; }
    public boolean isOccupied()    { return isOccupied; }
    public double  getHourlyRate() { return hourlyRate; }

    Optional<ParkingSpot> find(List<ParkingFloor> floors, String vehicleSize);

<ul>
  <li><strong>List</strong> — ordered, allows duplicates. Positional access. (<code>ArrayList</code>, <code>LinkedList</code>)</li>
  <li><strong>Set</strong> — no duplicates. No guaranteed order unless sorted. (<code>HashSet</code>, <code>LinkedHashSet</code>, <code>TreeSet</code>)</li>
  <li><strong>Map</strong> — key-value pairs, unique keys. (<code>HashMap</code>, <code>LinkedHashMap</code>, <code>TreeMap</code>)</li>
  <li><strong>Queue / Deque</strong> — FIFO or double-ended. (<code>LinkedList</code>, <code>ArrayDeque</code>, <code>PriorityQueue</code>)</li>

      },

        body: `<ul>
  <li>Need ordered, indexable storage? → <code>ArrayList</code>.</li>
  <li>Need fast lookups by a unique key? → <code>HashMap</code>.</li>

  <li>Need insertion-order preserved with fast lookups? → <code>LinkedHashMap</code> / <code>LinkedHashSet</code>.</li>
  <li>Need natural or custom sorted order? → <code>TreeMap</code> / <code>TreeSet</code>.</li>
  <li>Need priority-based processing? → <code>PriorityQueue</code>.</li>

        heading: 'Collections in the ParkingLot system',
        body: `Here is how each collection type maps to a real need in the parking lot:`,
        code: `class ParkingLot {
    private final String id;

    // LIST: ordered collection of floors; positional access meaningful
    private final List<ParkingFloor> floors = new ArrayList<>();

    // MAP: fast O(1) lookup of a ticket by its ID
    private final Map<String, Ticket> activeTickets = new HashMap<>();

    // SET: track unique vehicles currently inside (no duplicates needed)
    private final Set<String> vehiclesInside = new HashSet<>();

    public Ticket park(Vehicle v) {
        if (vehiclesInside.contains(v.getLicensePlate()))
            throw new VehicleAlreadyInsideException(v.getLicensePlate());

        ParkingSpot spot = spotFinder.find(floors, v.getSize())
                                     .orElseThrow(NoSpotAvailableException::new);
        spot.park(v);

        Ticket ticket = new Ticket(UUID.randomUUID().toString(), v, spot, LocalDateTime.now());
        activeTickets.put(ticket.getId(), ticket);      // O(1) store
        vehiclesInside.add(v.getLicensePlate());        // O(1) add to set
        return ticket;
    }

    public Receipt exit(String ticketId) {
        Ticket ticket = activeTickets.remove(ticketId); // O(1) lookup + remove
        if (ticket == null) throw new TicketNotFoundException(ticketId);

        ticket.getSpot().vacate();
        vehiclesInside.remove(ticket.getVehicle().getLicensePlate());

        double fee = feeService.calculate(ticket.getDurationMinutes(), ticket.getVehicle().getSize());
        return new Receipt(ticket, fee);
    }
}`

    private final List<ParkingSpot> spots = new ArrayList<>();

    // Count available spots of a given type
    public long countAvailable(String type) {
        return spots.stream()
            .filter(ParkingSpot::isAvailable)
            .filter(s -> s.getType().equals(type))
            .count();
    }

    // Find the first available spot that fits the vehicle
    public Optional<ParkingSpot> findSpot(String vehicleSize) {
        return spots.stream()
            .filter(s -> s.isAvailable() && s.canFit(vehicleSize))
            .findFirst();
    }

    // Collect all available spot IDs into a sorted list
    public List<String> availableSpotIds() {
        return spots.stream()
            .filter(ParkingSpot::isAvailable)
            .map(ParkingSpot::getId)
            .sorted()
            .collect(Collectors.toList());
    }

    // Group spots by type — Map<type, list of spots>

            .collect(Collectors.groupingBy(ParkingSpot::getType));

  <li><code>ArrayList</code> has O(1) random access; <code>LinkedList</code> has O(n). Prefer <code>ArrayList</code> unless you do heavy insertions/removals at arbitrary positions.</li>
  <li><code>HashMap</code> gives O(1) get/put on average; <code>TreeMap</code> gives O(log n) but keeps keys sorted.</li>
  <li>Use <code>Collections.unmodifiableList()</code> when returning an internal collection from a getter.</li>
  <li>For thread safety, use <code>ConcurrentHashMap</code> or synchronise access explicitly — plain <code>HashMap</code> is not thread-safe.</li>

<strong>Abstraction</strong> — expose what, hide how; program to interfaces.<br>
<strong>Inheritance</strong> — IS-A hierarchy; child extends parent contract.<br>
<strong>Polymorphism</strong> — one call, many behaviours; runtime dispatch via overriding.`
      },

        heading: 'What is the difference between abstract class and interface?',
        body: `<ul>
  <li>Abstract class can have state (fields), constructors, and concrete methods. Interface cannot have state (only constants) and had no concrete methods before Java 8.</li>
  <li>A class can extend only one abstract class but implement multiple interfaces.</li>
  <li>Use abstract class for IS-A with shared state (e.g. <code>ParkingSpot</code>). Use interface for capabilities (e.g. <code>ISpotFinder</code>).</li>
</ul>`
      },
      {
        heading: 'What is the difference between overloading and overriding?',
        body: `<strong>Overloading</strong> — same method name, different parameter signatures, resolved at compile time. <code>issue(Vehicle v)</code> and <code>issue(Vehicle v, ParkingSpot s)</code> are overloads.

<strong>Overriding</strong> — subclass replaces parent method with same name and signature, resolved at runtime. <code>CompactSpot.canFit()</code> overrides <code>ParkingSpot.canFit()</code>.`
      },
      {
        heading: 'What is the difference between == and equals()?',
        body: `<code>==</code> checks reference equality — do both variables point to the same object in memory?

<code>equals()</code> checks logical equality — do the two objects represent the same value? For <code>ParkingSpot</code>, two spots with the same <code>id</code> should be equal even if they are different object instances.

Always override <code>equals()</code> (and <code>hashCode()</code>) when you want value-based equality.`,
        code: `ParkingSpot s1 = new ParkingSpot("A-01", "COMPACT");
ParkingSpot s2 = new ParkingSpot("A-01", "COMPACT");

System.out.println(s1 == s2);        // false — different objects
System.out.println(s1.equals(s2));   // true  — same id (after overriding equals)`
      },
      {
        heading: 'What is the difference between checked and unchecked exceptions?',
        body: `<strong>Checked exceptions</strong> extend <code>Exception</code> (not <code>RuntimeException</code>). The compiler forces you to either catch them or declare <code>throws</code>. Use for recoverable situations callers should handle (<code>IOException</code>, <code>SQLException</code>).

<strong>Unchecked exceptions</strong> extend <code>RuntimeException</code>. No compiler requirement. Use for programming errors (<code>NullPointerException</code>, <code>IllegalArgumentException</code>) or domain errors that callers cannot always recover from (<code>NoSpotAvailableException</code>).`
      },
      {
        heading: 'What is the contract between equals() and hashCode()?',
        body: `If <code>a.equals(b)</code> is <code>true</code>, then <code>a.hashCode() == b.hashCode()</code> must also be <code>true</code>.

The reverse is not required — two objects can have the same hash code without being equal (a hash collision).

Breaking this contract causes silent bugs in <code>HashMap</code> and <code>HashSet</code>: equal objects are stored in different buckets and the collection reports them as different entries.`,
        code: `// CORRECT — same field in both equals and hashCode
@Override
public boolean equals(Object o) {
    if (!(o instanceof ParkingSpot)) return false;
    return Objects.equals(this.id, ((ParkingSpot) o).id);
}

@Override
public int hashCode() {
    return Objects.hash(id);   // same field as equals
}`
      },

        heading: 'What is the difference between this() and super()?',
        body: `<code>this(...)</code> — calls another constructor in the <em>same</em> class. Used for constructor chaining to avoid duplicating initialisation logic.

<code>super(...)</code> — calls a constructor in the <em>parent</em> class. Used to initialise inherited state.

Both must be the first statement in a constructor, so you cannot use both in the same constructor.`
      },

        heading: 'What is Liskov Substitution Principle?',
        body: `A subclass must be usable wherever its parent is expected — without the caller knowing or caring which subtype it has.

Concretely: if code loops over <code>List&lt;ParkingSpot&gt;</code> and calls <code>isAvailable()</code>, it must work correctly whether the list contains <code>CompactSpot</code>, <code>LargeSpot</code>, or <code>HandicappedSpot</code>.

A subclass violates LSP if it throws an exception from a method the parent promises to return a value from, or if it changes behaviour in a way that surprises callers.`,
        code: `// LSP VIOLATION — subclass throws instead of returning boolean
class BrokenSpot extends ParkingSpot {
    public boolean canFit(String size) {
        throw new UnsupportedOperationException(); // breaks caller assumption
    }
}

// LSP CORRECT — subclass narrows the rule but still returns boolean
class CompactSpot extends ParkingSpot {
    public boolean canFit(String size) {
        return size.equals("COMPACT") || size.equals("SMALL"); // valid boolean always
    }
}`

        heading: 'When should you use composition over inheritance?',
        body: `Use composition (HAS-A) when you want to reuse behaviour without committing to a type hierarchy.

Signs you need composition instead of inheritance:
<ul>
  <li>The IS-A sentence sounds wrong: "A ParkingLot IS-A ArrayList" — no.</li>
  <li>You only want one or two methods from the parent, not the whole contract.</li>
  <li>You want to swap the collaborating object at runtime.</li>
  <li>Inheriting would expose methods that callers should not have (<code>ArrayList.clear()</code> on a <code>ParkingLot</code>).</li>
</ul>`

<strong>LinkedList</strong> — doubly-linked nodes. O(n) random access (must traverse from head). O(1) insertion/removal at head or tail. Best for: frequent insertions/removals at arbitrary positions, or implementing a queue/deque.

In practice, <code>ArrayList</code> is the default choice 90% of the time. <code>LinkedList</code>'s O(1) insertion only wins if you already have a pointer to the node — which you rarely do.`
      }
    ]
  }
];

const HL_KEYWORDS = new Set(['public','private','protected','class','interface','abstract',
  'extends','implements','new','return','void','boolean','double','int','long','String',
  'List','Map','Set','Optional','Deque','Queue','this','super','throw','throws','if','else',
  'while','for','final','static','null','true','false','instanceof','enum','default',
  'switch','case','break','continue','try','catch','finally','import','package',
  'byte','short','char','float']);

function hl(code) {
  const s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const n = s.length;
  const out = [];
  let i = 0;
  while (i < n) {
    // single-line comment
    if (s[i] === '/' && s[i+1] === '/') {
      const end = s.indexOf('\n', i);
      const e = end === -1 ? n : end;
      out.push('<span class="cm">' + s.slice(i, e) + '</span>');
      i = e; continue;
    }
    // double-quoted string
    if (s[i] === '"') {
      let j = i + 1;
      while (j < n && s[j] !== '"' && s[j] !== '\n') { if (s[j] === '\\') j++; j++; }
      if (s[j] === '"') j++;
      out.push('<span class="st">' + s.slice(i, j) + '</span>');
      i = j; continue;
    }
    // word (keyword / class name / plain identifier)
    if (/[a-zA-Z_$]/.test(s[i])) {
      let j = i;
      while (j < n && /[a-zA-Z0-9_$]/.test(s[j])) j++;
      const w = s.slice(i, j);
      if (HL_KEYWORDS.has(w))      out.push('<span class="kw">' + w + '</span>');
      else if (w[0] >= 'A' && w[0] <= 'Z') out.push('<span class="cl">' + w + '</span>');
      else                         out.push(w);
      i = j; continue;
    }
    out.push(s[i++]);
  }
  return out.join('');
}
