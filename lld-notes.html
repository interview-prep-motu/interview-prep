<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LLD Interview Guide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f8fa;color:#1f2328;line-height:1.6;height:100vh;overflow:hidden;display:flex}

/* ── SIDEBAR ── */
#sidebar{width:260px;min-width:260px;height:100vh;background:#ffffff;border-right:1px solid #d0d7de;display:flex;flex-direction:column;overflow:hidden}
.sb-brand{padding:18px 18px 14px;border-bottom:1px solid #d0d7de;flex-shrink:0}
.sb-brand h1{font-size:15px;font-weight:700;color:#1f2328}
.sb-brand p{font-size:11px;color:#57606a;margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 0 20px}
.sb-section{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#8c959f;padding:16px 18px 6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;font-size:13px;color:#57606a;transition:all 0.1s;border-left:3px solid transparent;line-height:1.3}
.sb-item:hover{background:#f6f8fa;color:#1f2328}
.sb-item.active{background:#f0f6ff;color:#0969da;border-left-color:#0969da;font-weight:600}
.sb-item-letter{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.sb-item-num{font-size:10px;font-weight:700;color:#8c959f;min-width:20px}
.sb-item-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.sb-ptag{font-size:9px;font-weight:600;padding:1px 5px;border-radius:8px;background:#f0f6ff;color:#0550ae;border:1px solid #b6d4fe}
.sb-chip{font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:auto;flex-shrink:0}
.sb-easy{background:#dafbe1;color:#1a7f37}.sb-med{background:#fff8c5;color:#7d4e00}.sb-hard{background:#ffebe9;color:#cf222e}

/* ── MAIN CONTENT ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content-header{background:#fff;border-bottom:1px solid #d0d7de;padding:14px 36px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#content-title{font-size:17px;font-weight:700;color:#1f2328}
#content-badges{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
#content-body{flex:1;overflow-y:auto;padding:32px 40px}

.ptag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:#f0f6ff;color:#0550ae;border:1px solid #b6d4fe}

/* ── HOME SCREEN ── */
.home-screen{max-width:700px;margin:40px auto 0}
.home-screen h2{font-size:22px;font-weight:700;color:#1f2328;margin-bottom:8px}
.home-screen p{font-size:14px;color:#57606a;line-height:1.7;margin-bottom:28px}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.home-card{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:18px;cursor:pointer;transition:all 0.15s}
.home-card:hover{border-color:#0969da;box-shadow:0 4px 16px rgba(9,105,218,0.08)}
.home-card h3{font-size:14px;font-weight:700;color:#1f2328;margin-bottom:4px}
.home-card p{font-size:13px;color:#57606a}

.detail-body{padding-bottom:40px}

/* overview */
.overview-box{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:22px 26px;margin-bottom:28px}
.overview-box h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:10px}
.overview-box p{font-size:15px;color:#1f2328;line-height:1.7}

/* two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.panel{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:20px}
.panel h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:14px}
.class-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.class-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.class-name{font-size:13px;font-weight:700;color:#0550ae;min-width:160px;font-family:'Cascadia Code',Consolas,monospace}
.class-role{font-size:12.5px;color:#57606a;line-height:1.5}
.design-item{margin-bottom:10px;font-size:13.5px;color:#1f2328;line-height:1.6;padding-left:14px;position:relative}
.design-item::before{content:"→";position:absolute;left:0;color:#8c959f;font-size:11px;top:2px}

/* code section */
.code-section{margin-bottom:28px}
.code-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:10px}
.code-tabs{display:flex;gap:2px;margin-bottom:0;border-bottom:2px solid #d0d7de}
.code-tab{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;color:#57606a;border-radius:6px 6px 0 0;border:1px solid transparent;border-bottom:none;margin-bottom:-2px}
.code-tab.active{background:#fff;color:#0969da;border-color:#d0d7de;border-bottom-color:#fff}
.code-tab:not(.active):hover{background:#f6f8fa;color:#1f2328}
.code-pane{display:none;background:#fff;border:1px solid #d0d7de;border-top:none;border-radius:0 0 8px 8px;overflow:hidden}
.code-pane.active{display:block}
.code-pane pre{padding:20px;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:12.5px;line-height:1.65;overflow-x:auto;color:#1f2328;background:#f6f8fa}
.kw{color:#cf222e}.cl{color:#953800}.fn{color:#8250df}.cm{color:#6e7781;font-style:italic}.st{color:#0a3069}.an{color:#1a7f37}

/* SOLID applied */
.solid-applied{background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:22px 26px;margin-bottom:28px}
.solid-applied h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;margin-bottom:16px}
.solid-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.solid-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.solid-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.sb-s{background:#dafbe1;color:#1a7f37}.sb-o{background:#ddf4ff;color:#0550ae}.sb-l{background:#fbefff;color:#8250df}.sb-i{background:#fff8c5;color:#7d4e00}.sb-d{background:#ffebe9;color:#cf222e}
.solid-row-text{font-size:13.5px;color:#1f2328;line-height:1.6}
.solid-row-text strong{font-weight:600}

/* difficulty chips */
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.chip-easy{background:#dafbe1;color:#1a7f37;border:1px solid #4ac26b}
.chip-med{background:#fff8c5;color:#7d4e00;border:1px solid #eac54f}
.chip-hard{background:#ffebe9;color:#cf222e;border:1px solid #ff8182}

/* scrollbars */
#sidebar .sb-scroll::-webkit-scrollbar,#content-body::-webkit-scrollbar{width:5px}
#sidebar .sb-scroll::-webkit-scrollbar-track,#content-body::-webkit-scrollbar-track{background:transparent}
#sidebar .sb-scroll::-webkit-scrollbar-thumb,#content-body::-webkit-scrollbar-thumb{background:#d0d7de;border-radius:3px}

/* SOLID Index page */
.solid-index-body{padding-bottom:40px}
.solid-principle-card{background:#fff;border:1px solid #d0d7de;border-radius:10px;margin-bottom:28px;overflow:hidden}
.spc-header{padding:20px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #f0f0f0}
.spc-letter{font-size:44px;font-weight:900;line-height:1}
.spc-title{font-size:18px;font-weight:700;color:#1f2328}
.spc-tagline{font-size:13px;color:#57606a;font-style:italic}
.spc-body{padding:20px 24px}
.spc-what{font-size:14px;color:#1f2328;margin-bottom:20px;line-height:1.7}
.spc-examples{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.spc-ex{border-radius:8px;overflow:hidden;border:1px solid #d0d7de}
.spc-ex-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#57606a;padding:10px 14px 6px;background:#f6f8fa;border-bottom:1px solid #d0d7de}
.spc-ex-half{padding:10px 14px}
.spc-ex-half+.spc-ex-half{border-top:1px dashed #d0d7de}
.spc-bad-label{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#ffebe9;color:#cf222e;border:1px solid #ff8182;margin-bottom:5px}
.spc-good-label{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#dafbe1;color:#1a7f37;border:1px solid #4ac26b;margin-bottom:5px}
.spc-ex-text{font-size:13px;color:#1f2328;line-height:1.55;margin-bottom:6px}
.spc-ex-code{font-family:Consolas,monospace;font-size:11px;border-radius:4px;padding:6px 8px;display:block;white-space:pre-wrap;word-break:break-word}
.spc-bad-code{background:#fff5f5;color:#cf222e;border:1px solid #ffcecb}
.spc-good-code{background:#f0fff4;color:#1a7f37;border:1px solid #b7f0c4}
</style>
</head>

<nav id="sidebar">
  <div class="sb-brand">
    <h1>LLD Interview Guide</h1>
  </div>

    <div class="sb-section">Concepts</div>

<div id="main">
  <div id="content-header">
    <div id="content-title">Welcome</div>
    <div id="content-badges"></div>
  </div>

</div>

<script>
// ── SOLID PRINCIPLES DATA ──
const solidData = [
  {
    letter:'S', color:'#1a7f37', cls:'sb-s',
    name:'Single Responsibility',
    tagline:'"One class, one reason to change"',
    what:'Every class should own exactly one responsibility. If you describe a class using "and" — it handles payments AND sends emails — that\'s a violation. Each concern lives in its own class so a change in one area never breaks another.',
    examples:[
      {
        tag:'Parking Lot',
        badText:'ParkingLot handles spot allocation, ticketing, payment AND receipts. Changing fee logic risks breaking spot logic.',
        badCode:'class ParkingLot {\n  allocateSpot(v)\n  generateTicket(v)  // ← 4 jobs\n  processPayment(t)\n  printReceipt(t)\n}',
        goodText:'Each concern is its own class. Changing fee logic only touches PaymentService — SpotAllocator is never opened.',
        goodCode:'class SpotAllocator   { allocate(v) }\nclass TicketManager   { generate(v, spot) }\nclass PaymentService  { process(ticket) }\nclass ReceiptPrinter  { print(ticket) }'
      },
      {
        tag:'Uber',
        badText:'Trip class calculates fare, tracks GPS, notifies driver AND saves to DB. Four unrelated reasons to change.',
        badCode:'class Trip {\n  calculateFare()  // ← 4 jobs\n  trackGPS()\n  notifyDriver()\n  saveToDB()\n}',
        goodText:'Each job extracted. A GPS provider change only touches LocationTracker. DB schema change only touches TripRepository.',
        goodCode:'class FareCalculator    { calculate(trip) }\nclass LocationTracker  { getCurrent(driver) }\nclass NotificationSvc  { notifyDriver(d, t) }\nclass TripRepository   { save(trip) }'
      },
      {
        tag:'Vending Machine',
        badText:'VendingMachine manages inventory, accepts payment, dispenses items AND logs transactions all in one class.',
        badCode:'class VendingMachine {\n  manageInventory()  // ← 4 jobs\n  acceptPayment(amt)\n  dispenseItem(code)\n  logTransaction(t)\n}',
        goodText:'Each responsibility isolated. Adding cloud logging only touches TransactionLogger. Restocking logic only touches InventoryManager.',
        goodCode:'class InventoryManager  { isAvailable(code) }\nclass PaymentProcessor  { accept(amount) }\nclass Dispenser         { dispense(code) }\nclass TransactionLogger { log(transaction) }'
      },
    ]
  },
  {
    letter:'O', color:'#0550ae', cls:'sb-o',
    name:'Open / Closed',
    tagline:'"Open for extension, closed for modification"',
    what:'Once a class is written and tested, adding new behaviour should mean writing a new class — not editing the existing one. The classic smell is an if/else chain you keep cracking open. Fix: define an interface; new variants implement it.',
    examples:[
      {
        tag:'Parking Lot',
        badText:'Adding EV charging rate means opening PricingService and adding another else-if — risking bugs in existing hourly/daily logic.',
        badCode:'double getFee(Ticket t, String type) {\n  if (type == "hourly") ...\n  else if (type == "daily") ...\n  // add EV? edit this ↑\n}',
        goodText:'EVChargingPricing is a new class. HourlyPricing and DailyPricing are never touched. Adding weekend pricing = one new class.',
        goodCode:'interface PricingStrategy { double calculate(Ticket t); }\nclass HourlyPricing    implements PricingStrategy {}\nclass DailyPricing     implements PricingStrategy {}\nclass EVChargingPricing implements PricingStrategy {} // new, no edits above'
      },
      {
        tag:'BookMyShow',
        badText:'Adding BNPL payment means editing PaymentService\'s if/else — every new payment method risks breaking existing ones.',
        badCode:'void pay(Order o, String method) {\n  if (method == "card") ...\n  else if (method == "upi") ...\n  // add BNPL? edit this ↑\n}',
        goodText:'BNPLPayment is a new class. PaymentService.pay() accepts a PaymentMethod interface — never needs to change.',
        goodCode:'interface PaymentMethod { void pay(Order o); }\nclass CreditCardPayment implements PaymentMethod {}\nclass UPIPayment        implements PaymentMethod {}\nclass BNPLPayment       implements PaymentMethod {} // new, no edits above'
      },
      {
        tag:'Splitwise',
        badText:'Adding "split by income" means opening Splitter and adding another else-if branch — touching logic that already works.',
        badCode:'Map split(Expense e, String type) {\n  if (type == "equal") ...\n  else if (type == "percent") ...\n  // new type? edit this ↑\n}',
        goodText:'IncomeSplit is a new class. EqualSplit and PercentageSplit are never modified. The Splitter just calls strategy.split().',
        goodCode:'interface SplitStrategy { Map<User,Double> split(Expense e); }\nclass EqualSplit      implements SplitStrategy {}\nclass PercentageSplit implements SplitStrategy {}\nclass IncomeSplit     implements SplitStrategy {} // new, no edits above'
      },
    ]
  },
  {
    letter:'L', color:'#8250df', cls:'sb-l',
    name:'Liskov Substitution',
    tagline:'"Subclasses must be substitutable for their parent"',
    what:'Wherever you use a parent type, a child type must work correctly without the caller knowing the difference. A subclass that throws UnsupportedOperationException for an inherited method is a trap — the caller trusted the parent\'s contract.',
    examples:[
      {
        tag:'Parking Lot',
        badText:'ElectricVehicle overrides getParkingFee() to throw an exception. Any code iterating vehicles to compute fees now crashes on EVs.',
        badCode:'class ElectricVehicle extends Vehicle {\n  double getParkingFee(int hours) {\n    throw new UnsupportedOperationException();\n    // ↑ breaks all callers of Vehicle\n  }\n}',
        goodText:'ElectricVehicle returns parking + charging fee. It honours the contract — any code using Vehicle works with EV seamlessly.',
        goodCode:'class ElectricVehicle extends Vehicle {\n  double getParkingFee(int hours) {\n    return hours * 20 + hours * 10; // valid fee, no surprise\n  }\n}'
      },
      {
        tag:'BookMyShow',
        badText:'FreeShow overrides processPayment() to throw because "free shows don\'t need payment." BookingService now crashes on free shows.',
        badCode:'class FreeShow extends Show {\n  void processPayment(PaymentInfo info) {\n    throw new UnsupportedOperationException();\n    // ↑ BookingService calls this on every show\n  }\n}',
        goodText:'FreeShow.processPayment() returns true with zero charge. Same contract, no surprise — callers never need a special case for free shows.',
        goodCode:'class FreeShow extends Show {\n  boolean processPayment(PaymentInfo info) {\n    return true; // zero charge — contract honoured\n  }\n}'
      },
      {
        tag:'Uber',
        badText:'UberPool overrides getSinglePassengerFare() to throw "Pool has no single passenger." Every Ride reference now needs a null-check.',
        badCode:'class UberPool extends Ride {\n  double getSinglePassengerFare() {\n    throw new UnsupportedOperationException();\n    // ↑ breaks any Ride loop\n  }\n}',
        goodText:'Rename to getFare() and return per-person share. UberPool is safely substitutable wherever Ride is used.',
        goodCode:'class UberPool extends Ride {\n  double getFare() {\n    return (base + km * rate) / passengers;\n    // valid, substitutable\n  }\n}'
      },
    ]
  },
  {
    letter:'I', color:'#7d4e00', cls:'sb-i',
    name:'Interface Segregation',
    tagline:'"Don\'t force classes to implement what they don\'t use"',
    what:'A fat interface forces all implementing classes to stub out methods they\'ll never use. Those empty stubs are silent bugs waiting to happen. Split interfaces by role so each class only implements what it actually needs.',
    examples:[
      {
        tag:'Uber',
        badText:'IUser has requestRide(), acceptRide(), and banUser(). Rider is forced to "implement" driver and admin methods with empty bodies.',
        badCode:'interface IUser {\n  void requestRide();\n  void acceptRide();  // Rider never does this\n  void banUser();     // Rider never does this\n}\nclass Rider implements IUser {\n  void acceptRide() {} // empty stub\n  void banUser()    {} // empty stub\n}',
        goodText:'Three small interfaces. Rider only implements IRider. Driver only implements IDriver. Neither has dead code.',
        goodCode:'interface IRider  { void requestRide(); void cancelRide(); }\ninterface IDriver { void acceptRide(); void startTrip(); }\ninterface IAdmin  { void banUser(); void viewReports(); }\nclass Rider  implements IRider  {}\nclass Driver implements IDriver {}'
      },
      {
        tag:'BookMyShow',
        badText:'IBookingService has searchShows(), bookSeats(), manageTheater(), generateReports(). Customer impl leaves admin methods empty.',
        badCode:'interface IBookingService {\n  List<Show> searchShows(String city);\n  void bookSeats(List<Seat> seats);\n  void manageTheater(Theater t); // admin only\n  void generateReports();        // admin only\n}',
        goodText:'Split into three focused interfaces. CustomerService never sees admin methods. AdminService never sees booking methods.',
        goodCode:'interface ISearchService      { List<Show> searchShows(String city); }\ninterface IReservationService { void bookSeats(List<Seat> seats); }\ninterface IAdminService       { void manageTheater(Theater t); }\nclass CustomerService implements ISearchService, IReservationService {}'
      },
      {
        tag:'Vending Machine',
        badText:'IVendingMachine has selectItem(), insertCoin(), restock(), runDiagnostics(). CustomerPanel is forced to expose admin operations.',
        badCode:'interface IVendingMachine {\n  void selectItem(String code);\n  void insertCoin(double amt);\n  void restock(String code, int qty); // admin only\n  void runDiagnostics();              // admin only\n}',
        goodText:'CustomerPanel only implements ICustomerActions. Admins use IAdminActions. Users can never accidentally call restock().',
        goodCode:'interface ICustomerActions { void selectItem(String c); void insertCoin(double a); }\ninterface IAdminActions    { void restock(String c, int q); void runDiagnostics(); }\nclass CustomerPanel implements ICustomerActions {}\nclass AdminPanel    implements IAdminActions {}'
      },
    ]
  },
  {
    letter:'D', color:'#cf222e', cls:'sb-d',
    name:'Dependency Inversion',
    tagline:'"Depend on abstractions, not concretions"',
    what:'High-level business logic should not directly create low-level objects with new. That hard-wires the two together — you can\'t swap implementations or write tests. Fix: define an interface, inject the concrete class from outside via constructor.',
    examples:[
      {
        tag:'Parking Lot',
        badText:'ParkingLot hard-codes CashPayment with new. It can never accept UPI or Card without editing business logic.',
        badCode:'class ParkingLot {\n  // hard-wired — can never swap\n  private CashPayment payment = new CashPayment();\n\n  void checkout(Ticket t) {\n    payment.process(t.getFee());\n  }\n}',
        goodText:'ParkingLot receives IPayment via constructor. Pass CashPayment, CardPayment, or UPI — business logic never changes.',
        goodCode:'class ParkingLot {\n  private final IPayment payment; // interface\n\n  ParkingLot(IPayment payment) {  // injected\n    this.payment = payment;\n  }\n  void checkout(Ticket t) { payment.process(t.getFee()); }\n}'
      },
      {
        tag:'Uber',
        badText:'TripService creates GoogleMapsTracker directly. Swapping to MapBox or writing a test requires editing TripService.',
        badCode:'class TripService {\n  // locked to Google Maps forever\n  private GoogleMapsTracker tracker = new GoogleMapsTracker();\n\n  Location getDriverLocation(Driver d) {\n    return tracker.getLocation(d.getId());\n  }\n}',
        goodText:'TripService receives ILocationTracker via constructor. Inject GoogleMaps in prod, MockTracker in tests — TripService untouched.',
        goodCode:'class TripService {\n  private final ILocationTracker tracker; // interface\n\n  TripService(ILocationTracker tracker) { // injected\n    this.tracker = tracker;\n  }\n  Location getDriverLocation(Driver d) {\n    return tracker.getLocation(d.getId());\n  }\n}'
      },
      {
        tag:'BookMyShow',
        badText:'BookingService creates MySQLBookingRepo with new. Switching to MongoDB or running tests without a real DB is impossible.',
        badCode:'class BookingService {\n  // hard-wired to MySQL\n  private MySQLBookingRepo repo = new MySQLBookingRepo();\n\n  void confirm(Booking b) { repo.save(b); }\n}',
        goodText:'BookingService receives IBookingRepository via constructor. Inject MySQL in prod, InMemory in tests — zero changes to BookingService.',
        goodCode:'class BookingService {\n  private final IBookingRepository repo; // interface\n\n  BookingService(IBookingRepository repo) { // injected\n    this.repo = repo;\n  }\n  void confirm(Booking b) { repo.save(b); }\n}'
      },
    ]
  }
];

// ── PROBLEMS DATA ──
const problems = [
  {
    id:'parking-lot', title:'Parking Lot', difficulty:'Medium',
    patterns:['Strategy','Factory','Singleton','State'],
    overview:'A multi-level parking system that accepts different vehicle types, allocates spots based on size, generates tickets, calculates fees using pluggable pricing strategies, and processes payments.',
    classes:[
      {name:'ParkingLot',role:'Singleton entry point. Holds floors and delegates to allocator and payment.'},
      {name:'ParkingFloor',role:'Contains parking spots grouped by type.'},
      {name:'ParkingSpot',role:'Abstract. Subtypes: CompactSpot, LargeSpot, EVSpot, HandicappedSpot.'},
      {name:'Vehicle',role:'Abstract. Subtypes: Car, Truck, Bike, ElectricVehicle.'},
      {name:'SpotAllocator',role:'Finds the best available spot for a given vehicle type.'},
      {name:'Ticket',role:'Holds entry time, spot reference, and vehicle info.'},
      {name:'PricingStrategy',role:'Interface. Subtypes: HourlyPricing, DailyPricing, EVChargingPricing.'},
      {name:'PaymentService',role:'Accepts IPayment strategy and processes checkout.'},
      {name:'Gate',role:'Entry and exit gates that issue / validate tickets.'},
    ],
    design:[
      'Vehicle hierarchy determines which spot type is eligible (Car → Compact, Truck → Large, EV → EVSpot).',
      'ParkingLot is a Singleton — one instance per lot manages all floors.',
      'PricingStrategy is selected at checkout based on vehicle type and duration.',
      'SpotAllocator scans floors in order and returns the nearest available spot.',
      'Ticket carries entry timestamp; fee = strategy.calculate(ticket) at exit.',
    ],
    tabs:[
      {label:'Vehicle + Spot', code:
`public abstract class Vehicle {
    protected String licensePlate;
    protected VehicleType type;
    public abstract VehicleType getType();
}

public class ElectricVehicle extends Vehicle {
    public VehicleType getType() { return VehicleType.ELECTRIC; }
}

public abstract class ParkingSpot {
    protected boolean occupied;
    protected Vehicle vehicle;

`public class SeatLockService {
    // Map<seatId, lock expiry time>
    private final Map<String, Long> locks = new ConcurrentHashMap<>();
    private static final long LOCK_TTL_MS = 5 * 60 * 1000; // 5 minutes

    public boolean lock(Seat seat, String userId) {
        String key = seat.getId();
        if (locks.containsKey(key) && locks.get(key) > System.currentTimeMillis()) {
            return false; // already locked
        }
        locks.put(key, System.currentTimeMillis() + LOCK_TTL_MS);
        return true;
    }

    public void release(Seat seat) {
        locks.remove(seat.getId());
    }

    public boolean isLocked(Seat seat) {

        return expiry != null && expiry > System.currentTimeMillis();
    }

      {label:'Debt Simplifier', code:
`public class DebtSimplifier {
    // Greedy: reduce N*(N-1)/2 transactions to at most N-1
    public List<Transaction> simplify(Map<User, Double> netBalances) {
        List<Transaction> result = new ArrayList<>();
        PriorityQueue<Map.Entry<User,Double>> credits =
            new PriorityQueue<>((a,b) -> Double.compare(b.getValue(), a.getValue()));
        PriorityQueue<Map.Entry<User,Double>> debits =
            new PriorityQueue<>((a,b) -> Double.compare(a.getValue(), b.getValue()));

        netBalances.entrySet().forEach(e -> {
            if (e.getValue() > 0) credits.add(e);
            else if (e.getValue() < 0) debits.add(e);
        });

        while (!credits.isEmpty() && !debits.isEmpty()) {
            var creditor = credits.poll();
            var debtor   = debits.poll();
            double amount = Math.min(creditor.getValue(), -debtor.getValue());
            result.add(new Transaction(debtor.getKey(), creditor.getKey(), amount));
            // requeue remainder if any
        }
        return result;
    }
}`

`public class BalanceCalculator {
    // SRP — only computes balances, nothing else
    public Map<User, Double> calculate(Group group) {
        Map<User, Double> balances = new HashMap<>();
        group.getMembers().forEach(u -> balances.put(u, 0.0));

        for (Expense expense : group.getExpenses()) {
            User payer = expense.getPayer();
            Map<User, Double> shares = expense.getShares(group.getMembers());

            shares.forEach((user, share) -> {
                if (!user.equals(payer)) {
                    // payer is owed 'share' by 'user'
                    balances.merge(payer, share,  Double::sum);
                    balances.merge(user, -share, Double::sum);
                }
            });
        }
        return balances;
    }
}`

`public class CashDispenser {
    // SRP — only dispenses cash
    private final Map<Integer, Integer> cassettes; // denomination → count

    public CashDispenser(Map<Integer, Integer> cassettes) {
        this.cassettes = new TreeMap<>(Collections.reverseOrder());
        this.cassettes.putAll(cassettes);
    }

    public Map<Integer, Integer> dispense(double amount) {
        Map<Integer, Integer> dispensed = new LinkedHashMap<>();
        int remaining = (int) amount;
        for (Map.Entry<Integer, Integer> entry : cassettes.entrySet()) {
            int denom = entry.getKey();
            int count = Math.min(remaining / denom, entry.getValue());
            if (count > 0) {
                dispensed.put(denom, count);
                remaining -= denom * count;
                cassettes.put(denom, entry.getValue() - count);
            }
        }
        if (remaining > 0) throw new InsufficientCashException();
        return dispensed;
    }
}`

`public abstract class Piece {
    protected PieceColor color;
    protected Cell position;

    public abstract List<Cell> getValidMoves(Board board);

public class Rook extends Piece {
    public List<Cell> getValidMoves(Board board) {
        List<Cell> moves = new ArrayList<>();
        // horizontal + vertical rays until blocked
        int[][] directions = {{0,1},{0,-1},{1,0},{-1,0}};
        for (int[] dir : directions) {
            int r = position.getRow() + dir[0];
            int c = position.getCol() + dir[1];
            while (board.isValid(r, c)) {
                Cell cell = board.getCell(r, c);
                if (cell.isEmpty()) moves.add(cell);
                else { if (cell.getPiece().isEnemy(this)) moves.add(cell); break; }
                r += dir[0]; c += dir[1];
            }
        }
        return moves;
    }
}`

        int available = p.getStock() - reserved.getOrDefault(p.getId(), 0);

        reserved.merge(product.getId(), qty, Integer::sum);

        productRepo.decrementStock(product.getId(), qty);
        reserved.merge(product.getId(), -qty, Integer::sum);
    }

`public interface EncodingStrategy {
    String encode(String url);
}

public class Base62Encoding implements EncodingStrategy {
    private static final String CHARS =
        "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    private static final int BASE = 62;
    private final AtomicLong counter = new AtomicLong(100_000_000L);

    public String encode(String url) {
        long id = counter.getAndIncrement();
        StringBuilder sb = new StringBuilder();
        while (id > 0) {
            sb.append(CHARS.charAt((int)(id % BASE)));
            id /= BASE;
        }
        return sb.reverse().toString();
    }
}

public class URLShortener {
    private final EncodingStrategy encoder; // DIP
    private final URLRepository repo;       // DIP

    public URLShortener(EncodingStrategy encoder, URLRepository repo) {
        this.encoder = encoder;
        this.repo    = repo;
    }

    public String shorten(String originalUrl) {
        String code = encoder.encode(originalUrl);
        while (repo.exists(code)) code = encoder.encode(originalUrl); // collision retry
        repo.save(new URLMapping(code, originalUrl));
        return "https://short.ly/" + code;
    }
}`

`public interface RateLimiter {
    RateLimitResult tryAcquire(String clientId, String endpoint);
}

public class TokenBucketLimiter implements RateLimiter {
    private final int capacity;       // max tokens
    private final double refillRate;  // tokens per second
    private final BucketStore store;  // DIP — Redis or in-memory

    public TokenBucketLimiter(int capacity, double refillRate, BucketStore store) {
        this.capacity   = capacity;
        this.refillRate = refillRate;
        this.store      = store;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        String key = clientId + ":" + endpoint;
        Bucket bucket = store.getOrCreate(key, capacity);
        bucket.refill(refillRate);

        if (bucket.getTokens() >= 1) {
            bucket.consume(1);
            store.save(key, bucket);
            return RateLimitResult.allowed(bucket.getTokens());
        }
        return RateLimitResult.denied(bucket.getRetryAfterSeconds());
    }
}`
      },
      {label:'Sliding Window', code:
`public class SlidingWindowLimiter implements RateLimiter {
    private final int maxRequests;
    private final long windowMs;
    private final BucketStore store;

    public SlidingWindowLimiter(int maxRequests, long windowMs, BucketStore store) {
        this.maxRequests = maxRequests;
        this.windowMs    = windowMs;
        this.store       = store;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        String key = clientId + ":" + endpoint;
        long now = System.currentTimeMillis();
        long windowStart = now - windowMs;

        List<Long> timestamps = store.getTimestamps(key);
        // evict old timestamps outside the window
        timestamps.removeIf(t -> t < windowStart);

        if (timestamps.size() < maxRequests) {
            timestamps.add(now);
            store.saveTimestamps(key, timestamps);
            return RateLimitResult.allowed(maxRequests - timestamps.size());
        }
        long retryAfter = (timestamps.get(0) + windowMs - now) / 1000;
        return RateLimitResult.denied(retryAfter);
    }
}`

      {label:'Limiter Chain', code:
`public class RateLimiterChain implements RateLimiter {
    // Chain of Responsibility — apply limiters in order
    private final List<RateLimiter> limiters;

    public RateLimiterChain(List<RateLimiter> limiters) {
        this.limiters = limiters;
    }

    public RateLimitResult tryAcquire(String clientId, String endpoint) {
        for (RateLimiter limiter : limiters) {
            RateLimitResult result = limiter.tryAcquire(clientId, endpoint);
            if (!result.isAllowed()) return result; // fail fast
        }
        return RateLimitResult.allowed(-1); // all passed
    }
}

// Usage: global limit → per-user limit → per-endpoint limit
RateLimiter chain = new RateLimiterChain(List.of(
    new TokenBucketLimiter(1000, 100, store), // global: 1000 req/s
    new SlidingWindowLimiter(100, 60_000, store) // per-user: 100/min
));`

`public interface SchedulingStrategy {
    Elevator selectElevator(List<Elevator> elevators, FloorRequest request);
}

public class LOOKStrategy implements SchedulingStrategy {
    public Elevator selectElevator(List<Elevator> elevators, FloorRequest request) {
        return elevators.stream()
            .filter(e -> e.getState() != ElevatorStatus.MAINTENANCE)
            .min(Comparator.comparingInt(e -> cost(e, request)))
            .orElseThrow();
    }

    private int cost(Elevator e, FloorRequest req) {
        int dist = Math.abs(e.getFloor() - req.getFloor());
        boolean sameDir = (e.getDirection() == Direction.UP && req.getFloor() > e.getFloor())
                       || (e.getDirection() == Direction.DOWN && req.getFloor() < e.getFloor());
        return sameDir ? dist : dist + 100; // penalise direction change
    }
}

public class ElevatorController {
    private final List<Elevator> elevators;
    private final SchedulingStrategy scheduler; // DIP + OCP

    public ElevatorController(List<Elevator> elevators, SchedulingStrategy scheduler) {
        this.elevators = elevators;
        this.scheduler = scheduler;
    }

    public void handleRequest(FloorRequest request) {
        Elevator chosen = scheduler.selectElevator(elevators, request);
        chosen.addRequest(request);
    }
}`

    private final ChannelFactory factory;   // DIP
    private final IDeliveryRepo deliveryRepo;
    private final RetryHandler retryHandler;

    public NotificationService(ChannelFactory factory,
                               IDeliveryRepo repo,
                               RetryHandler retry) {
        this.factory      = factory;
        this.deliveryRepo = repo;
        this.retryHandler = retry;
    }

    public void send(NotificationRequest request) {
        List<NotificationChannel> channels =
            factory.getChannels(request.getRecipient(), request.getType());

        for (NotificationChannel channel : channels) {
            DeliveryStatus status = new DeliveryStatus(request, channel.getType());
            boolean success = channel.send(request);
            status.setDelivered(success);
            deliveryRepo.save(status);

            if (!success && request.getPriority() == Priority.HIGH) {
                retryHandler.schedule(request, channel); // exponential backoff
            }
        }
    }

public class NearestPartnerStrategy implements OrderAssignmentStrategy {
    public DeliveryPartner assign(Order order, List<DeliveryPartner> available) {

            .filter(DeliveryPartner::isAvailable)
            .min(Comparator.comparingDouble(p ->

`public class LRUCache<K, V> implements Cache<K, V> {
    private final int capacity;
    private final Map<K, Node<K,V>> map = new HashMap<>();
    private final DoublyLinkedList<K,V> list = new DoublyLinkedList<>();

    public LRUCache(int capacity) { this.capacity = capacity; }

    public Optional<V> get(K key) {
        if (!map.containsKey(key)) return Optional.empty();
        Node<K,V> node = map.get(key);
        list.moveToHead(node);
        return Optional.of(node.value);
    }

    public void put(K key, V value) {
        if (map.containsKey(key)) {
            Node<K,V> node = map.get(key);
            node.value = value;
            list.moveToHead(node);
            return;
        }
        if (map.size() >= capacity) {
            Node<K,V> tail = list.removeTail();
            map.remove(tail.key);
        }
        Node<K,V> newNode = new Node<>(key, value);
        list.addToHead(newNode);
        map.put(key, newNode);
    }

    public int size() { return map.size(); }
}

class Node<K, V> {
    K key; V value;
    Node<K,V> prev, next;
    Node(K k, V v) { key = k; value = v; }
}`

`public interface EvictionPolicy<K> {
    void recordAccess(K key);
    K evict();
}

public class LRUPolicy<K> implements EvictionPolicy<K> {
    private final LinkedHashSet<K> order = new LinkedHashSet<>();

    public void recordAccess(K key) {
        order.remove(key);
        order.add(key); // add to end = most recent
    }

    public K evict() {
        K oldest = order.iterator().next(); // first = least recent
        order.remove(oldest);
        return oldest;
    }
}

public class GenericCache<K, V> {
    private final int capacity;
    private final Map<K, V> store = new HashMap<>();
    private final EvictionPolicy<K> policy; // DIP — swap LRU/LFU/FIFO

    public GenericCache(int capacity, EvictionPolicy<K> policy) {
        this.capacity = capacity;
        this.policy   = policy;
    }

    public Optional<V> get(K key) {
        if (!store.containsKey(key)) return Optional.empty();
        policy.recordAccess(key);
        return Optional.of(store.get(key));
    }

    public void put(K key, V value) {
        if (store.size() >= capacity && !store.containsKey(key))
            store.remove(policy.evict());
        store.put(key, value);
        policy.recordAccess(key);
    }
}`

    public abstract void accept(FileSystemVisitor visitor);

    public void grantPermission(User user, Permission perm) {

    }

    }

public class File extends FileSystemEntry {
    private byte[] content;
    private final VersionHistory history = new VersionHistory();

    public long getSize() { return content.length; }

    public void save(byte[] newContent) {
        history.snapshot(content); // save old version
        this.content = newContent;
    }

    public void restore(int version) {
        this.content = history.get(version);
    }
}

public class Folder extends FileSystemEntry {
    private final List<FileSystemEntry> children = new ArrayList<>();

        entry.parent = this;
        children.add(entry);
    }

public class NameSearch implements SearchStrategy {
    public List<FileSystemEntry> search(String query, Folder root) {
        List<FileSystemEntry> results = new ArrayList<>();
        traverse(root, query.toLowerCase(), results);
        return results;
    }
    private void traverse(Folder folder, String q, List<FileSystemEntry> out) {
        folder.getChildren().forEach(entry -> {
            if (entry.getName().toLowerCase().contains(q)) out.add(entry);
            if (entry instanceof Folder) traverse((Folder) entry, q, out);
        });
    }
}

// ── RENDER FUNCTIONS ──
function hl(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/"([^"]*)"/g,'<span class="st">"$1"</span>')
    .replace(/\b(public|private|protected|class|interface|abstract|extends|implements|new|return|void|boolean|double|int|long|String|List|Map|Set|Optional|Deque|Queue|boolean|this|super|throw|throws|if|else|while|for|final|static|null|true|false|instanceof)\b/g,'<span class="kw">$1</span>')
    .replace(/\b([A-Z][A-Za-z0-9]*)\b/g,'<span class="cl">$1</span>');
}

  document.getElementById('content-badges').innerHTML = '';

  document.getElementById('content-body').innerHTML =
    `<div class="solid-index-body">${solidData.map(solidCardHtml).join('')}</div>`;
  document.getElementById('content-body').scrollTop = 0;
}

function oopCardHtml(o) {
  const uid = o.name.toLowerCase().replace(/\s+/g,'-');
  return `
    <div class="solid-card">
      <div class="solid-card-header" style="border-left:4px solid ${o.color}">
        <div class="solid-letter" style="background:${o.color}20;color:${o.color}">${o.icon}</div>
        <div>
          <div class="solid-name">${o.name}</div>
          <div class="solid-tagline">${o.what}</div>
        </div>
      </div>
      ${o.examples.map((e,i) => {
        const eid = uid+'-ex-'+i;
        return `
        <div class="spc-example">
          <div class="spc-tag">${e.tag}</div>
          <div class="spc-row">
            <div class="spc-half spc-bad">
              <div class="spc-label spc-bad-label">Bad</div>
              <p class="spc-desc">${e.badText}</p>
              <pre class="spc-ex-code spc-bad-code">${hl(e.badCode)}</pre>
            </div>
            <div class="spc-half spc-good">
              <div class="spc-label spc-good-label">Good</div>
              <p class="spc-desc">${e.goodText}</p>
              <pre class="spc-ex-code spc-good-code">${hl(e.goodCode)}</pre>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function showOOPIndex() {
  setActive('oop');
  document.getElementById('content-title').textContent = 'OOP Concepts';
  document.getElementById('content-badges').innerHTML = '';

  document.getElementById('content-body').innerHTML =
    `<div class="solid-index-body">${oopData.map(oopCardHtml).join('')}</div>`;
  document.getElementById('content-body').scrollTop = 0;
}

function switchTab(el, targetId) {
  const section = el.closest('.code-section');
  section.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
  section.querySelectorAll('.code-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(targetId).classList.add('active');
}

buildSidebar();
</script>
</body>
